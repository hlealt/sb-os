# Context injection manifest for a skill, workflow step, or command.
# Firing is AUTOMATIC via the installed Claude Code hook (install/hooks.py wires it;
# resolve_context.py --hook) — no agent runs the resolver by hand.
#
# Three surfaces, each resolved under user_context_root (default .user/context/, set in sb-os.json):
#   skill         -> {user_context_root}/skills/{skill-name}.yaml
#   workflow step -> {user_context_root}/{workflow-path}/{step-name}.yaml
#   command       -> {user_context_root}/commands/{command-name}.yaml
#
# Entry schema (top-level `context:` list; one entry per source):
#   name        (required, all)        human-readable label
#   type        (required, all)        file | script | url | text | mcp
#   mode        (optional, all)        read (default) | write | read-write
#   instruction (required, all)        what the agent must do with the loaded content
#   path        (file, script)         vault-relative file/dir path
#   glob        (file)                 glob to match files within `path`
#   select      (file)                 latest | all
#   count       (file)                 max files (with select: latest)
#   sections    (file)                 list of heading names to extract
#   command     (script)              executable path
#   args        (script)              list of CLI args
#   url         (url)                  URL to fetch
#   content     (text)                inline text
#   server,tool (mcp)                 MCP server + tool names
#   params      (mcp)                 MCP tool params object
#
# Full schema, path resolution, and processing rules: para/docs/context-injection-schema.md

context:
  # --- type: file (read) ---
  - name: User preferences
    type: file
    mode: read
    path: .user/profile/preferences.md
    instruction: >
      Load user preferences and apply them throughout this workflow step.

  # --- type: file with sections filter ---
  - name: Weekly goals
    type: file
    mode: read
    path: 0-periodic-notes/weekly/YYYY-Wnn.md
    sections:
      - "Goals"
      - "Priorities"
    instruction: >
      Read the user's weekly goals and priorities for context.

  # --- type: file with glob and selection ---
  - name: Recent daily notes
    type: file
    mode: read
    path: 0-periodic-notes/daily/
    glob: "YYYY-MM-*.md"
    select: latest
    count: 3
    instruction: >
      Load the 3 most recent daily notes. Summarize open tasks.

  # --- type: file (write) ---
  - name: Summary output
    type: file
    mode: write
    path: .user/runtime/state/weekly-summary.md
    instruction: >
      Write the consolidated summary from this step to this file.

  # --- type: file (read-write) ---
  - name: Running log
    type: file
    mode: read-write
    path: .user/runtime/state/running-log.md
    instruction: >
      Read the current log, append today's observations, write back.

  # --- type: script ---
  - name: External data fetch
    type: script
    command: python
    args:
      - .user/runtime/scripts/fetch-data.py
      - --account
      - default
    instruction: >
      Run the script. Use the output as input for this step.

  # --- type: url ---
  - name: External reference
    type: url
    url: https://example.com/api/status
    instruction: >
      Fetch the status page and report any active incidents.

  # --- type: text ---
  - name: Custom guidance
    type: text
    content: >
      Always greet the user by name and summarize the previous session
      before starting new work.
    instruction: >
      Apply this guidance at the start of the workflow step.

  # --- type: mcp ---
  - name: Channel summary
    type: mcp
    server: {server-name}
    tool: {tool-name}
    params:
      query: "weekly update"
      limit: 5
    instruction: >
      Query the MCP server and summarize key results.
