# Stratified hand-checked GOLD set for the thin-page detector (OD-1 keystone).
#
# Each entry is a REAL (page, raw) pair hand-read by the builder (opus) on
# 2026-06-19, labelled thin|faithful, stratified by source kind
# (paper | article | podcast). For thin pages, `missing` lists the SPECIFIC
# load-bearing signal the page dropped vs its raw (the detector must surface
# these); for faithful pages, `retained` notes the load-bearing signal the page
# correctly preserved (the detector must NOT flag these).
#
# `split: cal` = calibration (thresholds may be tuned on these);
# `split: test` = HELD OUT — downstream tasks 2.2/2.3/2.4 MUST NOT calibrate on
# these; they are the final precision/recall measurement only.
#
# `check`:
#   deep   = page AND raw read in full / near-full; missing items verbatim-verified.
#   signal = page read + raw load-bearing STRUCTURE scanned (heading/framework
#            coverage, numeric-density gap); label defensible from that scan.
#
# The two empty-half source-page sections (`My take`, `Sources`) and the lead
# paragraph are EXCLUDED from the compare-set and never count toward thinness
# (wiki-schema.md): only Substance + Counterpoints + Methodology + Notable quotes.
#
# Paths are vault-root-relative. `raw` mirrors the page stem under raw/{origin}/.
#
# OD-1 stratification finding: the THINNESS SIGNATURE DIFFERS BY KIND —
#   * papers go thin by DROPPING SPECIFIC NUMBERS / results / effect sizes
#     (numbers-kept-but-key-numbers-dropped), while keeping prose;
#   * podcasts go thin by COLLAPSING NAMED FRAMEWORKS / DEFINITIONS / CONTRARIAN
#     TAKES into generic gist bullets (the lennys-podcast raws are 6-category
#     structured extractions — Frameworks, Actionable Principles, Contrarian
#     Takes, Definitions, Operating Practices, Anti-Patterns — and the thin
#     pages routinely drop Definitions + Contrarian Takes + Operating Practices);
#     numbers are rarely the dropped signal here;
#   * articles (Every/Stratechery/Ben-Evans essays) were mostly FAITHFUL — the
#     essay form resists collapse better than the dense paper / structured
#     podcast forms; the thin article cases drop CONCRETE IMPLEMENTATION DETAIL
#     (directory-naming rules, conflict models, templates) while keeping principles.
# This is exactly the manufactured-thin (deletion) vs real-thin (under-extraction)
# distributional-mismatch risk OD-1 names: a checker calibrated only on numeric
# ablation would miss the podcast framework-collapse class. The silver-ablation
# generator therefore ablates BOTH numeric AND rule_label/caveat/named_entity/
# reasoning_chain classes so the synthetic positives cover the podcast signature
# too; `reasoning_chain` is carried as an UNMEASURED class (OD-6 guardrail bait).

